- name: install packages
  hosts: dev  test
  tasks:  
    - name: yum install php and mariadb packages in dev and test
      dnf:
        name:
          - php
          - mariadb-server
        state: present

- name: install group packages
  hosts: prod
  tasks:  
    - name: yum install group package on prod group
      dnf: 
        name: "@RPM Development Tools"
        state: present

- name: update dev packages
  hosts: dev
  tasks:  
    - name: update dev packages
      dnf:
        name: "*"
        state: latest

