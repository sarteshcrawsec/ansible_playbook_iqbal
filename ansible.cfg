[defaults]
remote_user=greg
inventory=/home/desktop/git/ansible_playbook/inventory
roles_path=/home/desktop/git/ansible_playbook/roles:/usr/share/ansible/roles
collections_path=/home/desktop/git/ansible_playbook/mycollections:/usr/share/ansible/collections
ask_pass=false
host_key_checking=false
callbacks_enabled=profile_tasks

[privilege_escalation]
become=true
become_method=sudo
become_user=root
become_ask_pass=false
